[tool.poetry]
name = "bg-lib-recommender"
version = "1.0.0"
description = "BoardGameGeek data pipeline and recommender system"
authors = ["MichoelSnow <michoelsnow@gmail.com>"]
readme = "README.md"
packages = [
    { include = "data_pipeline" }
]

[tool.poetry.dependencies]
python = "^3.13"
fastapi = "^0.135.1"
sqlalchemy = "^2.0.48"
requests = "^2.33.0"
pandas = "^3.0.1"
selenium = "^4.32.0"
beautifulsoup4 = "^4.13.4"
fastparquet = "^2024.11.0"
scipy = "^1.15.3"
scikit-learn = "^1.8.0"
ipywidgets = "^8.1.7"
uvicorn = "^0.34.3"
gunicorn = "^23.0.0"
alembic = "^1.16.1"
httpx = "^0.28.1"
tqdm = "^4.67.1"
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
bcrypt = ">=4.0,<5.0"
python-multipart = "^0.0.31"
python-dotenv = "^1.1.1"
duckdb = "1.5.5"
lxml = "^6.1.0"
tenacity = "^9.1.2"
psycopg2-binary = "^2.9.11"
boto3 = "^1.42.63"
pillow = "^13.0.0"
starlette = "^1.3.1"
pyjwt = "^2.15.1"


[tool.poetry.group.dev.dependencies]
rapidfuzz = "^3.13.0"
pytest = "^9.0.3"
ruff = "^0.13.0"
pip-audit = "^2.10.0"
jupyterlab = "^4.6.4"
jupyterlab-code-formatter = "^3.0.3"
jupyterlab-execute-time = "^3.3.0"

[tool.ruff]
line-length = 88
target-version = "py313"
extend-exclude = ["data_pipeline/notebooks"]

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["."]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
