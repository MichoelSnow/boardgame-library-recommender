name: Fly Machine Runtime Alerts

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  fly-machine-alerts:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    concurrency: fly-machine-alerts
    steps:
      - uses: actions/checkout@v5

      - name: Check Fly Machine states
        run: python3 scripts/alerts/check_fly_machines.py
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          FLY_ORG_SLUG: ${{ vars.FLY_ORG_SLUG }}
